<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Church Schedule</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="container py-5">
        <div class="text-center mb-4">
            <h1 class="text-3xl font-bold">📅 Church Schedule</h1>
            <p class="text-gray-600">Updated automatically from Google Sheets</p>
        </div>

        <ul id="scheduleList" class="list-group shadow"></ul>
    </div>

    <script>
        const SHEET_ID = "1P4tHksUSd-cYVcU-mYQYvutL-c1S-V2Nj1hlb-yR28w";
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        // Get this week's Saturday
        function getThisWeeksSaturday() {
            const today = new Date();
            const dayOfWeek = today.getDay(); // 0 = Sunday, 6 = Saturday
            const daysUntilSaturday = (6 - dayOfWeek + 7) % 7 || 7; // If today is Saturday, get today; otherwise next Saturday
            const saturday = new Date(today);
            saturday.setDate(today.getDate() + (daysUntilSaturday === 7 ? 0 : daysUntilSaturday));
            return saturday;
        }

        // Format date as "DD MMM" (e.g., "31 Jan")
        function formatDate(date) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = date.getDate().toString().padStart(2, '0');
            const month = months[date.getMonth()];
            return `${day} ${month}`;
        }

        fetch(SHEET_URL)
            .then(res => res.text())
            .then(text => {
                const json = JSON.parse(text.substring(47, text.length - 2));
                const rows = json.table.rows;
                const list = document.getElementById("scheduleList");

                // Debug: log the data structure
                console.log("Total rows:", rows.length);
                console.log("First few rows:", rows.slice(0, 5));

                // Get this Saturday's date
                const thisSaturday = getThisWeeksSaturday();
                const targetDate = formatDate(thisSaturday);
                console.log("Looking for date:", targetDate);

                // Find the column index for this week's Saturday
                const dateRow = rows[0]; // Row with dates (TANGGAL row)
                let columnIndex = -1;

                console.log("Date row:", dateRow);

                if (dateRow && dateRow.c) {
                    console.log("Searching through columns...");
                    for (let i = 1; i < dateRow.c.length; i++) {
                        const cellValue = dateRow.c[i]?.v || "";
                        const formattedValue = dateRow.c[i]?.f || "";
                        console.log(`Column ${i}: v="${cellValue}", f="${formattedValue}"`);
                        
                        // Check both the value and formatted value
                        const searchIn = cellValue + " " + formattedValue;
                        if (searchIn.includes(targetDate.split(' ')[0]) && searchIn.includes(targetDate.split(' ')[1])) {
                            columnIndex = i;
                            console.log("Found match at column", i);
                            break;
                        }
                    }
                }

                if (columnIndex === -1) {
                    list.innerHTML = `<li class='list-group-item text-warning'>No schedule found for ${targetDate}. Check console for debug info.</li>`;
                    return;
                }

                // Display the schedule for this Saturday
                list.innerHTML = `<li class='list-group-item bg-primary text-white'>
                    <h4 class="font-bold mb-0">Schedule for ${targetDate}</h4>
                </li>`;

                // Skip header rows and process schedule rows
                for (let i = 4; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row.c) continue;

                    const role = row.c[0]?.v || "";
                    const person = row.c[columnIndex]?.v || "";

                    // Skip empty roles or section headers
                    if (!role || !person || role.includes("DEWASA") || role.includes("KHOTBAH")) {
                        if (role.includes("DEWASA") || role.includes("KHOTBAH")) {
                            const item = document.createElement("li");
                            item.className = "list-group-item bg-light";
                            item.innerHTML = `<h5 class="font-bold mb-0 text-primary">${role}</h5>`;
                            list.appendChild(item);
                        }
                        continue;
                    }

                    const item = document.createElement("li");
                    item.className = "list-group-item";
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-semibold text-gray-700">${role}</span>
                            <span class="text-gray-900">${person}</span>
                        </div>
                    `;
                    list.appendChild(item);
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById("scheduleList").innerHTML =
                    "<li class='list-group-item text-danger'>Failed to load schedule</li>";
            });
    </script>

</body>

</html>
